[project]
name = "headstorm-blueprint"
version = "0.1.0"
description = "Blueprint analysis: classification (EfficientNet-B0 head on synthetic plans), EasyOCR text, OpenCV room/wall segmentation, optional Roboflow detection"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "easyocr>=1.7.2",
    "gradio>=5.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "pytest>=8.0",
    "ruff>=0.6",
    "torch>=2.4",
    "torchvision>=0.19",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
roboflow = ["roboflow>=1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
extend-exclude = ["common"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
